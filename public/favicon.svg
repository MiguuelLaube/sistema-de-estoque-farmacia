<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="favRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="favTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="favCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(0, 0)" filter="url(#favShadow)">
    <!-- Base de Fundo / Sombra -->
    <ellipse cx="42" cy="74" rx="34" ry="7" fill="#0f172a" fill-opacity="0.12" />

    <!-- Topo -->
    <path d="M42 6 L76 24 L42 42 L8 24 Z" fill="url(#favTop)" />
    <!-- Esquerda -->
    <path d="M8 24 L42 42 L42 72 L8 54 Z" fill="url(#favLeft)" />
    <!-- Direita -->
    <path d="M42 42 L76 24 L76 54 L42 72 Z" fill="url(#favRight)" />

    <!-- Vincos da caixa -->
    <path d="M42 6 L42 42" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.4" stroke-linecap="round" />
    <path d="M8 24 L42 42" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.3" stroke-linecap="round" />
    <path d="M76 24 L42 42" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.4" stroke-linecap="round" />

    <!-- Selo Central da Cruz Médica -->
    <g transform="translate(42, 42)">
      <circle cx="0" cy="0" r="16" fill="#ffffff" />
      <circle cx="0" cy="0" r="13.5" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1" />
      <rect x="-3" y="-9" width="6" height="18" rx="2" fill="url(#favCross)" />
      <rect x="-9" y="-3" width="18" height="6" rx="2" fill="url(#favCross)" />
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    </g>
  </g>
</svg>
